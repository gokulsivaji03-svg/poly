name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polycopy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      POLYCOPY_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost/polycopy_test
      POLYCOPY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost/polycopy
      POLYCOPY_RUN_WORKERS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --all-groups
        working-directory: backend
      - run: uv run ruff check . ../tests/backend && uv run basedpyright app && uv run pytest -q
        working-directory: backend
      - run: npm ci && npm test && npm run lint && npm run build
        working-directory: frontend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Start application
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE polycopy'
          cd backend
          uv run alembic upgrade head
          .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          cd ../frontend
          npm run dev -- --host 127.0.0.1 > /tmp/ui.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health && curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/api.log /tmp/ui.log
          exit 1
      - run: npm test
        working-directory: tests/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: tests/e2e/test-results
